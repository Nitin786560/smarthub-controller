name: Auto-Compile & Deploy Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI Compiler Environment
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Core Architecture
        run: |
          # --- SELF-CLEANING FIX ---
          # Force clears any broken URL index caches left behind by previous failed runs
          rm -rf ~/.arduino15/package_index.json*
          rm -rf ~/.arduino15/cache/*

          # Initialize index using the official stable server parameters cleanly
          arduino-cli core update-index --additional-urls https://esp8266.com
          
          # Retry loop with a 15-second gap handles minor network drops smoothly
          for i in {1..3}; do
            arduino-cli core install esp8266:esp8266 --additional-urls https://esp8266.com && break || sleep 15
          done

      - name: Restructure Project Directory for CLI Standard
        run: |
          mkdir -p build_workspace/smarthub
          cp smarthub.ino build_workspace/smarthub/smarthub.ino

      - name: Compile Code into Binary
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 ./build_workspace/smarthub --output-dir ./build_out

      - name: Deploy Firmware Update Directly to Repository Root
        run: |
          mv ./build_out/*.bin ./firmware.bin
          rm -rf ./build_workspace ./build_out
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add firmware.bin
          git diff-index --quiet HEAD || git commit -m "Automated cloud compile: firmware.bin updated [Skip CI]"
          git push origin HEAD:${{ github.ref }}
