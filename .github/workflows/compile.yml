name: Auto-Compile & Deploy Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI Compiler Environment
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Core Architecture
        run: |
          # --- TOTAL CONFIG RESET FIX ---
          # 1. Force clear any broken local config files or cache directories entirely
          rm -rf ~/.arduino15

          # 2. Re-initialize a blank, clean configuration file profile layout
          arduino-cli config init --overwrite

          # 3. Strictly bind the board URL setting directly into the CLI variables layer
          arduino-cli config set board_manager.additional_urls https://esp8266.com

          # 4. Sync indices cleanly matching our direct profile target
          arduino-cli core update-index
          
          # Retry loop with a 15-second gap handles minor network drops smoothly
          for i in {1..3}; do
            arduino-cli core install esp8266:esp8266 && break || sleep 15
          done

      - name: Restructure Project Directory for CLI Standard
        run: |
          mkdir -p build_workspace/smarthub
          cp smarthub.ino build_workspace/smarthub/smarthub.ino

      - name: Compile Code into Binary
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 ./build_workspace/smarthub --output-dir ./build_out

      - name: Deploy Firmware Update Directly to Repository Root
        run: |
          mv ./build_out/*.bin ./firmware.bin
          rm -rf ./build_workspace ./build_out
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add firmware.bin
          git diff-index --quiet HEAD || git commit -m "Automated cloud compile: firmware.bin updated [Skip CI]"
          git push origin HEAD:${{ github.ref }}
