name: Compile & Package ESP8266 Firmware

on:
  push:
    branches:
      - main
    paths:
      - '**.ino'
      - '.github/workflows/compile.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Board Platform
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Install External Libraries
        run: |
          arduino-cli lib update-index
          # Install external dependencies required by smarthub.ino
          arduino-cli lib install "ArduinoJson"

      - name: Compile Sketch
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --output-dir build \
            smarthub.ino

      - name: Commit and Push Compiled Binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Move output binary to root target
          cp build/smarthub.ino.bin firmware.bin
          
          git add firmware.bin
          
          # Commit only if changes exist to prevent empty commit errors
          if ! git diff --staged --quiet; then
            git commit -m "build(ci): auto-compile updated firmware.bin [skip ci]"
            git push origin main
          else
            echo "No changes detected in compiled binary."
          fi
