name: Compile and Release SmartHub Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'smarthub.ino'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Arduino CLI Environment
        uses: arduino/setup-arduino-cli@v2

      - name: Purge Broken Configuration and Core Cache
        run: |
          echo "Purging old configuration caches..."
          rm -rf ~/.arduino15
          arduino-cli config init --overwrite

      - name: Configure ESP8266 Core Index Managers
        run: |
          arduino-cli config set board_manager.additional_urls https://esp8266.com
          arduino-cli core update-index

      - name: Install ESP8266 Board Core Package
        run: |
          arduino-cli core install esp8266:esp8266

      - name: Compile Microchip Firmware Asset
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir ./build smarthub.ino

      - name: Stage and Push Compiled Binary to Repository Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Move binary from isolation build folder to the repository root
          cp ./build/smarthub.ino.bin ./firmware.bin
          
          # Track, commit, and push back to main branch
          git add firmware.bin
          
          # Only commit if changes actually exist to prevent runner loops
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated CI Build: Update firmware.bin [Build Signature: $GITHUB_RUN_NUMBER]"
            git push origin main
          else
            echo "No firmware changes detected. Skipping push."
          fi

