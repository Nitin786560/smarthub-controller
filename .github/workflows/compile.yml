name: Auto-Compile & Deploy Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # --- TOTAL LOGICAL SANDBOX FIX ---
      # We construct an entirely new config directory inside /tmp to fully bypass any system cache
      - name: Initialize Isolated Environment
        run: |
          mkdir -p /tmp/arduino_home
          mkdir -p /tmp/arduino_data
          curl -fsSL https://githubusercontent.com | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Install ESP8266 Core Architecture
        env:
          ARDUINO_DATA_DIR: /tmp/arduino_data
          ARDUINO_DOWNLOADS_DIR: /tmp/arduino_home/downloads
          ARDUINO_USER_DIR: /tmp/arduino_home/user
        run: |
          # Explicitly set the configuration using environment flags
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls https://esp8266.com
          arduino-cli core install esp8266:esp8266 --additional-urls https://esp8266.com

      - name: Restructure Project Directory for CLI Standard
        run: |
          mkdir -p build_workspace/smarthub
          cp smarthub.ino build_workspace/smarthub/smarthub.ino

      - name: Compile Code into Binary
        env:
          ARDUINO_DATA_DIR: /tmp/arduino_data
          ARDUINO_DOWNLOADS_DIR: /tmp/arduino_home/downloads
          ARDUINO_USER_DIR: /tmp/arduino_home/user
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 ./build_workspace/smarthub --output-dir ./build_out

      - name: Deploy Firmware Update Directly to Repository Root
        run: |
          mv ./build_out/*.bin ./firmware.bin
          rm -rf ./build_workspace ./build_out
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add firmware.bin
          git diff-index --quiet HEAD || git commit -m "Automated cloud compile: firmware.bin updated [Skip CI]"
          git push origin HEAD:${{ github.ref }}

