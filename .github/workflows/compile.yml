- name: Scaffold CLI-Compliant Build Sandbox
        run: |
          mkdir -p build_dir

          # Locate any .ino file anywhere in the checked-out repository
          SKETCH_PATH=$(find . -maxdepth 3 -not -path '*/.*' -not -path './build_dir*' -name "*.ino" | head -n 1)

          if [ -z "$SKETCH_PATH" ]; then
            echo "::error::No .ino file found anywhere in repository tree!"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi

          echo "Found target sketch at: $SKETCH_PATH"
          SKETCH_DIR=$(dirname "$SKETCH_PATH")

          # Copy all source assets alongside the discovered sketch
          cp "$SKETCH_PATH" build_dir/build_dir.ino

          # Copy any adjacent header/source files from the sketch's directory
          shopt -s nullglob
          for ext in h hpp cpp c; do
            files=("$SKETCH_DIR"/*.$ext)
            if [ ${#files[@]} -gt 0 ]; then
              cp "$SKETCH_DIR"/*.$ext build_dir/
            fi
          done

          # Also pull root-level headers if sketch was in a subdirectory
          if [ "$SKETCH_DIR" != "." ]; then
            for ext in h hpp cpp c; do
              files=(*.$ext)
              if [ ${#files[@]} -gt 0 ]; then
                cp *.$ext build_dir/
              fi
            done
          fi

          echo "Sandbox prepared successfully. Contents:"
          ls -la build_dir/
