name: Compile & Build ESP8266 Firmware

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*.*.*"
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Board Core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Install Core Libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "LiquidCrystal_I2C"
          arduino-cli lib install "LiquidCrystal"

      - name: Scaffold CLI-Compliant Build Sandbox
        run: |
          mkdir -p build_dir
          if [ -f "smarthub.ino" ]; then
            cp smarthub.ino build_dir/build_dir.ino
          elif [ -f "*.ino" ]; then
            cp *.ino build_dir/build_dir.ino
          else
            echo "::error::Primary .ino file not found in root repository."
            exit 1
          fi

          shopt -s nullglob
          for ext in h hpp cpp c; do
            files=(*.$ext)
            if [ ${#files[@]} -gt 0 ]; then
              cp *.$ext build_dir/
            fi
          done

      - name: Compile Sketch
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --output-dir ./build_output \
            build_dir

      - name: Stage Firmware Binary and Checksum
        run: |
          if [ -f "./build_output/build_dir.ino.bin" ]; then
            cp ./build_output/build_dir.ino.bin ./firmware.bin
          else
            BIN_PATH=$(find ./build_output -type f -name "*.bin" | head -n 1)
            if [ -n "$BIN_PATH" ]; then
              cp "$BIN_PATH" ./firmware.bin
            else
              echo "::error::Compiled firmware binary was not generated."
              exit 1
            fi
          fi
          
          # Generate MD5 hash for ESP8266httpUpdate validation
          md5sum ./firmware.bin | awk '{print $1}' > ./firmware.bin.md5
          ls -lh ./firmware.bin*

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthub-firmware
          path: |
            ./firmware.bin
            ./firmware.bin.md5
          retention-days: 14

      - name: Create GitHub Release and Publish Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./firmware.bin
            ./firmware.bin.md5
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
