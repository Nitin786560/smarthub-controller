<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>SmartHub Multi-Slave AI Grid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #020617;
      --surface: #0b1329;
      --card: #131f36;
      --border: #24385a;
      --border-bright: #38bdf8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --ai: #a855f7;
      --text: #ffffff;
      --text-dim: #cbd5e1;
      --radius: 16px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Mukta', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px 10px 96px 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .icon {
      font-family: 'Material Symbols Rounded', sans-serif;
      font-size: 26px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .app-header {
      background: rgba(11, 19, 41, 0.98);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(56,189,248,0.45);
    }

    .badge-ver {
      background: var(--primary);
      color: #000;
      font-size: 13px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .app-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    /* 3-Slave Reactor Status Matrix */
    .slave-status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .slave-pill {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .slave-pill.online {
      border-color: var(--success);
      box-shadow: 0 0 10px rgba(34,197,94,0.3);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
    }
    .slave-pill.online .status-dot { background: var(--success); }

    /* Target Selector Bar */
    .target-bar {
      background: var(--card);
      border: 2px solid var(--border-bright);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .target-pills {
      display: flex;
      gap: 6px;
    }

    .target-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .target-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      height: 48px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #fff;
    }
    .btn-action:active { transform: scale(0.96); }

    .btn-on { background: var(--success); }
    .btn-off { background: var(--danger); }
    .btn-p { background: var(--primary); color: #000; }
    .btn-ai { background: var(--ai); color: #fff; }

    input, select {
      width: 100%;
      height: 48px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .log-strip {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-dim);
      font-family: monospace;
      min-height: 42px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<div class="container">
  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="icon" style="color:var(--primary); font-size:30px;">hub</span>
      <span class="brand-title">SmartHub 3-Uno AI</span>
    </div>
    <span class="badge-ver" id="fw_badge">v2.4.0</span>
  </header>

  <!-- 3 Uno Slaves Live Health Monitor -->
  <section class="slave-status-grid">
    <div class="slave-pill" id="slave_box_1">
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="status-dot"></div>
        <strong style="font-size:14px;">Uno-1</strong>
      </div>
      <span style="font-size:11px; color:var(--text-dim);" id="ip_disp_1">.21</span>
    </div>

    <div class="slave-pill" id="slave_box_2">
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="status-dot"></div>
        <strong style="font-size:14px;">Uno-2</strong>
      </div>
      <span style="font-size:11px; color:var(--text-dim);" id="ip_disp_2">.22</span>
    </div>

    <div class="slave-pill" id="slave_box_3">
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="status-dot"></div>
        <strong style="font-size:14px;">Uno-3</strong>
      </div>
      <span style="font-size:11px; color:var(--text-dim);" id="ip_disp_3">.23</span>
    </div>
  </section>

  <!-- Target Routing Matrix -->
  <section class="target-bar">
    <span style="font-size:13px; font-weight:800; color:var(--primary);">🎯 लक्षित यूनिट चुनें (Dispatch Target):</span>
    <div class="target-pills">
      <button class="target-btn active" onclick="setTarget('all', this)">सब पर भेजें (ALL)</button>
      <button class="target-btn" onclick="setTarget('1', this)">Uno-1</button>
      <button class="target-btn" onclick="setTarget('2', this)">Uno-2</button>
      <button class="target-btn" onclick="setTarget('3', this)">Uno-3</button>
    </div>
  </section>

  <!-- Unified Actuator Switches -->
  <section class="app-card">
    <h3 style="font-size:15px; font-weight:900; color:var(--text-dim);">रिले नियंत्रण (लक्षित नोड हेतु)</h3>
    <div class="btn-grid">
      <button class="btn-action btn-on" onclick="sendRelay('1', 'on')">R1 चालू (ON)</button>
      <button class="btn-action btn-off" onclick="sendRelay('1', 'off')">R1 बंद (OFF)</button>
    </div>
    <div class="btn-grid" style="margin-top:4px;">
      <button class="btn-action btn-on" onclick="sendRelay('2', 'on')">R2 चालू (ON)</button>
      <button class="btn-action btn-off" onclick="sendRelay('2', 'off')">R2 बंद (OFF)</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
      <span style="font-size:14px; font-weight:800; color:var(--text-dim);">सिंक्रनाइज़्ड PWM रेगुलेशन:</span>
      <strong id="pwm_val_txt" style="color:var(--primary); font-family: monospace;">0</strong>
    </div>
    <input type="range" min="0" max="255" value="0" oninput="document.getElementById('pwm_val_txt').innerText=this.value" onchange="sendPWM(this.value)">
  </section>

  <!-- Autonomous AI Intent Engine -->
  <section class="app-card" style="border-color:var(--ai);">
    <h3 style="color:var(--ai); font-size:15px; font-weight:900;">AI मल्टी-यूनिट एज कंट्रोल</h3>
    <input type="text" id="ai_prompt_txt" placeholder="उदा. 'all on', 'sleep mode', 'all off'">
    <button class="btn-action btn-ai" onclick="submitAI()">AI निष्पादित करें</button>
  </section>

  <!-- Dynamic Slave IP Configuration -->
  <section class="app-card">
    <h3 style="font-size:15px; font-weight:900; color:var(--warning);">स्लेव IP प्रबंधन (EEPROM Reconfigure)</h3>
    <select id="cfg_slave_sel">
      <option value="1">Uno Unit 1</option>
      <option value="2">Uno Unit 2</option>
      <option value="3">Uno Unit 3</option>
    </select>
    <input type="text" id="cfg_slave_ip" placeholder="e.g. 192.168.4.21">
    <button class="btn-action btn-p" onclick="saveSlaveIP()">सुरक्षित करें (Save IP)</button>
  </section>

  <div class="log-strip" id="system_log">मल्टी-स्लेव क्लाउड ग्रिड तैयार है।</div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "smarthub-controller-default-rtdb.firebaseio.com",
    databaseURL: "https://smarthub-controller-default-rtdb.firebaseio.com",
    projectId: "smarthub-controller",
    storageBucket: "smarthub-controller.firebasestorage.app",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const rtdb = firebase.database();
  let currentTarget = "all";

  function setTarget(t, btn) {
    currentTarget = t;
    document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('system_log').innerText = `लक्षित इकाई सेट: ${t.toUpperCase()}`;
  }

  rtdb.ref('/smarthub/telemetry').on('value', snap => {
    const d = snap.val();
    if (!d) return;

    document.getElementById('fw_badge').innerText = 'v' + (d.version || '2.4.0');

    // Update 3 Slaves Online Status
    if (d.slaves && Array.isArray(d.slaves)) {
      d.slaves.forEach(s => {
        const box = document.getElementById(`slave_box_${s.id}`);
        const ipTxt = document.getElementById(`ip_disp_${s.id}`);
        if (box) box.classList.toggle('online', !!s.online);
        if (ipTxt) ipTxt.innerText = s.ip.split('.').slice(-1)[0] ? ('.' + s.ip.split('.').slice(-1)[0]) : s.ip;
      });
    }

    if (d.ai_log) document.getElementById('system_log').innerText = d.ai_log;
  });

  function sendRelay(ch, state) {
    rtdb.ref('/smarthub/control/relay_dispatch').set({
      target: currentTarget,
      ch: ch,
      state: state,
      ts: Date.now()
    });
    document.getElementById('system_log').innerText = `रिले ${ch} ${state.toUpperCase()} -> [${currentTarget.toUpperCase()}]`;
  }

  function sendPWM(v) {
    rtdb.ref('/smarthub/control/pwm').set(parseInt(v));
  }

  function submitAI() {
    const val = document.getElementById('ai_prompt_txt').value.trim();
    if (!val) return;
    rtdb.ref('/smarthub/control/ai_prompt').set(val);
    document.getElementById('ai_prompt_txt').value = '';
  }

  function saveSlaveIP() {
    const s = document.getElementById('cfg_slave_sel').value;
    const ip = document.getElementById('cfg_slave_ip').value.trim();
    if (!ip) return;
    rtdb.ref(`/smarthub/control/config_slave_ip/${s}`).set(ip);
    document.getElementById('system_log').innerText = `Uno-${s} IP अपडेट भेजा गया: ${ip}`;
  }
</script>

</body>
</html>
