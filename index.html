<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>SmartHub Unified Cloud AI Core</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #020617;
      --surface: #0b1329;
      --card: #131f36;
      --border: #24385a;
      --border-bright: #38bdf8;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.5);
      --success: #22c55e;
      --danger: #ef4444;
      --ai: #a855f7;
      --text: #ffffff;
      --text-dim: #cbd5e1;
      --radius: 16px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Mukta', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px 32px 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .icon {
      font-family: 'Material Symbols Rounded', sans-serif;
      font-size: 26px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .app-header {
      background: rgba(11, 19, 41, 0.98);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .badge-ver {
      background: var(--primary);
      color: #000;
      font-size: 13px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .app-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h3 {
      font-size: 15px;
      font-weight: 900;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .tel-box {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
    }

    .tel-lbl { font-size: 13px; font-weight: 800; color: var(--text-dim); }
    .tel-val { font-size: 18px; font-weight: 900; font-family: monospace; color: var(--primary); margin-top: 2px; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      height: 52px;
      border-radius: 12px;
      border: none;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      transition: transform 0.15s, filter 0.15s;
    }
    .btn-action:active { transform: scale(0.96); filter: brightness(1.2); }

    .btn-on { background: var(--success); }
    .btn-off { background: var(--danger); }
    .btn-ai { background: var(--ai); width: 100%; }
    .btn-ota { background: var(--primary); color: #000; width: 100%; }

    input[type="text"] {
      width: 100%;
      height: 52px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0 16px;
      color: #fff;
      font-size: 17px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--border-bright); }

    input[type="range"] {
      width: 100%;
      height: 8px;
      background: var(--card);
      border-radius: 4px;
      outline: none;
      margin: 8px 0;
    }

    .log-box {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dim);
      font-family: monospace;
      min-height: 48px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="icon" style="color:var(--primary); font-size:32px;">hub</span>
      <span class="brand-title">SmartHub AI</span>
    </div>
    <span class="badge-ver" id="fw_badge">v2.2.0</span>
  </header>

  <section class="app-card">
    <div class="tel-grid">
      <div class="tel-box">
        <div class="tel-lbl">क्लाउड लिंक</div>
        <div class="tel-val" id="cloud_status" style="color:var(--success);">ऑनलाइन</div>
      </div>
      <div class="tel-box">
        <div class="tel-lbl">सिग्नल (RSSI)</div>
        <div class="tel-val" id="rssi_val">-- dBm</div>
      </div>
      <div class="tel-box">
        <div class="tel-lbl">रनटाइम</div>
        <div class="tel-val" id="uptime_val">0s</div>
      </div>
    </div>
  </section>

  <section class="app-card" style="border-color: var(--ai);">
    <h3 style="color:var(--ai);">
      <span class="icon">psychology</span> AI एज इंटेंट कंट्रोल
    </h3>
    <input type="text" id="ai_input" placeholder="उदा. 'it is dark', 'turn off all', 'movie dim'">
    <button class="btn-action btn-ai" onclick="dispatchAI()">
      <span class="icon">bolt</span> निर्देश भेजें (Execute Intent)
    </button>
  </section>

  <section class="app-card">
    <h3><span class="icon">toggle_on</span> रिले नियंत्रण (Relays)</h3>
    <div class="btn-grid">
      <button class="btn-action btn-on" onclick="setRelay(1, true)">
        <span class="icon">power</span> R1 चालू
      </button>
      <button class="btn-action btn-off" onclick="setRelay(1, false)">
        <span class="icon">power_off</span> R1 बंद
      </button>
    </div>

    <div class="btn-grid" style="margin-top: 4px;">
      <button class="btn-action btn-on" onclick="setRelay(2, true)">
        <span class="icon">power</span> R2 चालू
      </button>
      <button class="btn-action btn-off" onclick="setRelay(2, false)">
        <span class="icon">power_off</span> R2 बंद
      </button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
      <span style="font-size:15px; font-weight:800; color:var(--text-dim);">PWM रेगुलेशन:</span>
      <strong id="pwm_readout" style="color:var(--primary); font-family: monospace; font-size:18px;">0</strong>
    </div>
    <input type="range" min="0" max="255" value="0" id="pwm_slider" 
           oninput="document.getElementById('pwm_readout').innerText=this.value" 
           onchange="setPWM(this.value)">
  </section>

  <section class="app-card">
    <h3><span class="icon">cloud_sync</span> वैश्विक OTA अपडेट</h3>
    <button class="btn-action btn-ota" onclick="triggerOTA()">
      <span class="icon">download</span> GitHub से नया फर्मवेयर खींचें
    </button>
  </section>

  <div class="log-box" id="system_log">क्लाउड सिंक्रोनाइज़ेशन तैयार है।</div>
</div>

<script>
  // Paste your Firebase web app config here:
  const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "smarthub-controller-default-rtdb.firebaseapp.com",
    databaseURL: "https://smarthub-controller-default-rtdb.firebaseio.com",
    projectId: "smarthub-controller",
    storageBucket: "smarthub-controller.firebasestorage.app",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const rtdb = firebase.database();

  rtdb.ref('/smarthub/telemetry').on('value', snap => {
    const d = snap.val();
    if (!d) return;

    document.getElementById('fw_badge').innerText = 'v' + (d.version || '2.2.0');
    document.getElementById('rssi_val').innerText = (d.rssi || 0) + ' dBm';
    document.getElementById('uptime_val').innerText = (d.uptime_s || 0) + 's';
    document.getElementById('cloud_status').innerText = d.online ? 'ऑनलाइन' : 'ऑफलाइन';
    document.getElementById('cloud_status').style.color = d.online ? 'var(--success)' : 'var(--danger)';

    if (d.ai_log) {
      document.getElementById('system_log').innerText = d.ai_log;
    }
  });

  function setRelay(channel, state) {
    rtdb.ref(`/smarthub/control/relay${channel}`).set(state);
    document.getElementById('system_log').innerText = `रिले ${channel} -> ${state ? 'चालू' : 'बंद'} भेजा गया।`;
  }

  function setPWM(val) {
    rtdb.ref('/smarthub/control/pwm').set(parseInt(val));
    document.getElementById('system_log').innerText = `PWM ड्यूटी: ${val} सेट की गई।`;
  }

  function dispatchAI() {
    const input = document.getElementById('ai_input');
    const prompt = input.value.trim();
    if (!prompt) return;

    document.getElementById('system_log').innerText = `AI निर्देश भेजा जा रहा है: "${prompt}"...`;
    rtdb.ref('/smarthub/control/ai_prompt').set(prompt);
    input.value = '';
  }

  function triggerOTA() {
    rtdb.ref('/smarthub/control/trigger_ota').set(true);
    document.getElementById('system_log').innerText = 'GitHub OTA जांच ट्रिगर की गई।';
  }
</script>

</body>
</html>
